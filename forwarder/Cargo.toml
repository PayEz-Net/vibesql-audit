[package]
name = "vibe-audit-forwarder"
version = "0.1.0"
edition = "2021"
description = "VibeSQL Audit forwarder sidecar — hash chain, batch write, GELF forwarding"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.7"
flate2 = "1"
hostname = "0.4"
futures-util = "0.3"
